name: Test Installation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e .

      - name: Test CLI
        run: |
          ai-config --help
          ai-config init --fresh
          ai-config validate
          ai-config status

      - name: Test migration (mock)
        run: |
          mkdir -p ~/.config/devin
          cat > ~/.config/devin/config.json << 'EOF'
          {
            "agent": {
              "model": "test-model"
            },
            "permissions": {
              "allow": ["Read(**)"]
            }
          }
          EOF
          ai-config migrate devin
          ai-config validate

  test-install-script:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test install script (non-interactive)
        env:
          NONINTERACTIVE: 1
        run: |
          chmod +x install.sh
          LOCAL_SOURCE_DIR="$(pwd)" ./install.sh --yes --local

      - name: Verify installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ai-config --help
          ai-config validate
          ai-config status

      - name: Test uninstall script
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          echo "y" | ./uninstall.sh || NONINTERACTIVE=1 ./uninstall.sh

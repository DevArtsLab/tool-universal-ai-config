name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/

  publish-pypi:
    needs: dist
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/universal-ai-config
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  binaries:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build binary
        run: |
          pip install . pyinstaller
          pyinstaller --onefile --name "ai-config-${{ matrix.target }}" universal_ai_config/__main__.py

      - name: Smoke test binary
        shell: bash
        run: ./dist/ai-config-${{ matrix.target }}* --help

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.target }}
          path: dist/ai-config-${{ matrix.target }}*

  release:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: release-binaries
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - > release-notes.md <<'PY'
          import re
          version = __import__("os").environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md").read()
          m = re.search(rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          section = m.group(1).strip() if m else ""
          print("## What's Changed\n")
          print(section if section else "See CHANGELOG.md for details.")
          PY
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release-binaries/*
          body_path: release-notes.md
          generate_release_notes: true
